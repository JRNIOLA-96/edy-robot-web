<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - LOOI Autonomous Face</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #d1f7ff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 35px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(209, 247, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 14px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            z-index: 20;
        }

        /* Pantalla horizontal forzada a 90 grados */
        .face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            position: relative;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 110px;
            /* TransiciÃ³n suave y orgÃ¡nica para el movimiento de los ojos */
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Ojos grandes, limpios y con brillo OLED estilo LOOI */
        .eye {
            width: 165px;
            height: 165px;
            background: #d1f7ff;
            border-radius: 50%;
            animation: blink 4.5s infinite ease-in-out;
            box-shadow: 
                0 0 35px rgba(209, 247, 255, 0.45),
                inset -18px -18px 0px rgba(18, 75, 160, 0.55);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.06); }
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="iniciarSistema()">
        <h1>ðŸ¤– Robot Edy</h1>
        <p>Toca la pantalla para despertar a Edy</p>
        <button id="start-btn">INICIAR</button>
    </div>

    <div id="status">Desconectado</div>

    <div class="face-container" id="face">
        <div class="eyes-row" id="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const eyesRow = document.getElementById('eyes-row');
        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        let mqttClient = null;
        let mqttConectado = false;

        function conectarMqtt() {
            if (!window.mqtt) return;
            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, { clientId, clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => { 
                mqttConectado = true; 
                statusEl.textContent = 'Edy autÃ³nomo en lÃ­nea'; 
            });
        }

        async function enviarAccion(tipo) {
            if (mqttConectado && mqttClient) { 
                mqttClient.publish(MQTT_ACTION_TOPIC, tipo); 
                return; 
            }
            try { 
                await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' }); 
            } catch (e) {}
        }

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        }

        // DefiniciÃ³n de posiciones con sus respectivas etiquetas fÃ­sicas
        const posiciones = [
            { nombre: 'centro', x: 0,   y: 0 },
            { nombre: 'arriba_izq', x: -55, y: -38 },
            { nombre: 'arriba_der', x:  55, y: -38 },
            { nombre: 'abajo_izq',  x: -55, y:  38 },
            { nombre: 'abajo_der',  x:  55, y:  38 }
        ];

        let posicionActualIndex = 0; // Empieza en el centro

        function cicloAutonomo() {
            // Decidir aleatoriamente el siguiente estado: 
            // Mayor probabilidad de ir al centro si estÃ¡ en una esquina, o moverse entre esquinas.
            let proximoIndex;
            let currentPos = posiciones[posicionActualIndex];

            if (currentPos.nombre === 'centro') {
                // Desde el centro, elegir una de las 4 esquinas aleatoriamente
                proximoIndex = Math.floor(Math.random() * 4) + 1; 
            } else {
                // Desde una esquina, 50% de probabilidad de ir al centro o 50% de ir a otra esquina
                if (Math.random() < 0.5) {
                    proximoIndex = 0; // Centro
                } else {
                    // Otra esquina aleatoria distinta a la actual
                    do {
                        proximoIndex = Math.floor(Math.random() * 4) + 1;
                    } while (proximoIndex === posicionActualIndex);
                }
            }

            posicionActualIndex = proximoIndex;
            let destino = posiciones[posicionActualIndex];

            // Mover los ojos visualmente en la pantalla
            eyesRow.style.transform = `translate(${destino.x}px, ${destino.y}px)`;
            
            // Enviar la orden fÃ­sica al ESP32 (arriba, abajo o centro)
            enviarAccion(destino.nombre);

            // Determinar cuÃ¡nto tiempo se quedarÃ¡ en esta nueva posiciÃ³n
            let tiempoEstancia;
            if (destino.nombre === 'centro') {
                tiempoEstancia = 6000; // 6 segundos fijos en el centro (pasa la mayor parte del tiempo aquÃ­)
            } else {
                // Entre 3 y 5 segundos en las esquinas (3000 a 5000 ms)
                tiempoEstancia = Math.floor(Math.random() * (5000 - 3000 + 1)) + 3000;
            }

            // Programar el siguiente movimiento
            setTimeout(cicloAutonomo, tiempoEstancia);
        }

        function iniciarSistema() {
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            conectarMqtt();
            
            // Arrancar el ciclo autÃ³nomo principal tras 2 segundos
            setTimeout(cicloAutonomo, 2000);
        }
    </script>
</body>
</html>
