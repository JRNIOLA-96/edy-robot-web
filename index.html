<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - Smart Face & Clock</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #d1f7ff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 35px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(209, 247, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 14px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            z-index: 20;
        }

        /* Pantalla horizontal forzada a 90 grados */
        .face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            position: relative;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 110px;
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .eye {
            width: 165px;
            height: 165px;
            background: #d1f7ff;
            border-radius: 50%;
            animation: blink 4.5s infinite ease-in-out;
            box-shadow: 
                0 0 35px rgba(209, 247, 255, 0.45),
                inset -18px -18px 0px rgba(18, 75, 160, 0.55);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.06); }
        }

        /* --- RELOJ DIGITAL ESTILO iOS CON GAMA DE COLORES ARMÃ“NICOS --- */
        #clock-container {
            position: absolute;
            display: none; /* Oculto por defecto hasta que pase 1 minuto */
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            z-index: 50;
            background-color: #000000;
        }

        .clock-digit {
            font-size: 150px;
            font-weight: 900;
            line-height: 1;
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: -2px;
        }

        /* Tonos armÃ³nicos cercanos y elegantes inspirados en la referencia */
        #digit-h { color: #ff66b2; } /* Rosa vibrante */
        #digit-m1 { color: #b886ff; } /* Lila suave */
        #digit-m2 { color: #d946ef; } /* Morado magenta luminoso */

        .clock-dots {
            display: flex;
            flex-direction: column;
            gap: 22px;
            justify-content: center;
        }

        .dot {
            width: 18px;
            height: 18px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="iniciarSistema()">
        <h1>ðŸ¤– Robot Edy</h1>
        <p>Toca la pantalla para despertar a Edy</p>
        <button id="start-btn">INICIAR</button>
    </div>

    <div id="status">Desconectado</div>

    <!-- Rostro normal / curioso -->
    <div class="face-container" id="face" onclick="registrarInteraccion()">
        <div class="eyes-row" id="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
    </div>

    <!-- Pantalla de Reloj Digital (Aparece al minuto de inactividad) -->
    <div id="clock-container" onclick="registrarInteraccion()">
        <div class="clock-digit" id="digit-h">9</div>
        <div class="clock-dots">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="clock-digit" id="digit-m1">4</div>
        <div class="clock-digit" id="digit-m2">1</div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const eyesRow = document.getElementById('eyes-row');
        const faceContainer = document.getElementById('face');
        const clockContainer = document.getElementById('clock-container');
        
        const digitH = document.getElementById('digit-h');
        const digitM1 = document.getElementById('digit-m1');
        const digitM2 = document.getElementById('digit-m2');

        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        let mqttClient = null;
        let mqttConectado = false;

        let timerInactividad30s = null;
        let timerReloj1min = null;
        let temporizadorEsquina = null;
        let modoCuriosoActivo = false;
        let modoRelojActivo = false;

        function conectarMqtt() {
            if (!window.mqtt) return;
            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, { clientId, clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => { 
                mqttConectado = true; 
                statusEl.textContent = 'Edy activo (Normal)'; 
            });
        }

        async function enviarAccion(tipo) {
            if (mqttConectado && mqttClient) { 
                mqttClient.publish(MQTT_ACTION_TOPIC, tipo); 
                return; 
            }
            try { 
                await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' }); 
            } catch (e) {}
        }

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        }

        const posiciones = [
            { nombre: 'centro', x: 0,   y: 0 },
            { nombre: 'arriba_izq', x: -55, y: -38 },
            { nombre: 'arriba_der', x:  55, y: -38 },
            { nombre: 'abajo_izq',  x: -55, y:  38 },
            { nombre: 'abajo_der',  x:  55, y:  38 }
        ];

        function iniciarModoCurioso() {
            if (modoRelojActivo) return;
            modoCuriosoActivo = true;
            statusEl.textContent = 'Edy curioso (Inactivo)...';
            bucleCurioso();
        }

        function bucleCurioso() {
            if (!modoCuriosoActivo || modoRelojActivo) return;
            let proximoIndex = Math.floor(Math.random() * 4) + 1;
            let destino = posiciones[proximoIndex];

            eyesRow.style.transform = `translate(${destino.x}px, ${destino.y}px)`;
            enviarAccion(destino.nombre);

            let tiempoEstancia = Math.floor(Math.random() * (5000 - 3000 + 1)) + 3000;
            temporizadorEsquina = setTimeout(bucleCurioso, tiempoEstancia);
        }

        // --- ACTIVAR RELOJ DIGITAL AL MINUTO DE INACTIVIDAD ---
        function iniciarModoReloj() {
            modoCuriosoActivo = false;
            clearTimeout(temporizadorEsquina);
            modoRelojActivo = true;

            // Ocultar ojos y mostrar reloj
            faceContainer.style.display = 'none';
            clockContainer.style.display = 'flex';
            statusEl.textContent = 'Modo Reloj Digital';

            // Ordenar al ESP32 que ponga la cabeza fija en el centro y bloquee movimiento
            enviarAccion('centro_bloqueado');
            actualizarHoraReloj();
        }

        function actualizarHoraReloj() {
            if (!modoRelojActivo) return;
            const ahora = new Date();
            let horas = ahora.getHours();
            let minutos = ahora.getMinutes();

            // Formato 12 horas o 24 horas (aquÃ­ usamos 12h estÃ©tico tipo iOS)
            horas = horas % 12 || 12;
            let minStr = minutos < 10 ? '0' + minutos : '' + minutos;

            digitH.textContent = horas;
            digitM1.textContent = minStr.charAt(0);
            digitM2.textContent = minStr.charAt(1);

            setTimeout(actualizarHoraReloj, 1000);
        }

        // --- INTERACCIÃ“N TÃCTIL ---
        function registrarInteraccion() {
            activarPantallaCompleta();

            // Si estaba en modo curioso o en modo reloj, restaurar pantalla normal
            if (modoCuriosoActivo || modoRelojActivo) {
                modoCuriosoActivo = false;
                modoRelojActivo = false;
                clearTimeout(temporizadorEsquina);

                clockContainer.style.display = 'none';
                faceContainer.style.display = 'flex';
                eyesRow.style.transform = 'translate(0px, 0px)';
                
                enviarAccion('centro_bloqueado'); // Mantiene cabeza firme al centro para no tambalear el telÃ©fono
                statusEl.textContent = 'InteracciÃ³n detectada';
            }

            // Reiniciar ambos temporizadores de inactividad
            clearTimeout(timerInactividad30s);
            clearTimeout(timerReloj1min);

            timerInactividad30s = setTimeout(iniciarModoCurioso, 30000); // 30 segundos -> Curioso
            timerReloj1min = setTimeout(iniciarModoReloj, 60000);       // 60 segundos -> Reloj digital
        }

        function iniciarSistema() {
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            conectarMqtt();

            eyesRow.style.transform = 'translate(0px, 0px)';
            enviarAccion('centro');

            // Arrancar temporizadores
            timerInactividad30s = setTimeout(iniciarModoCurioso, 30000);
            timerReloj1min = setTimeout(iniciarModoReloj, 60000);
        }
    </script>
</body>
</html>
