<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - Modo Seguimiento Facial</title>
    <!-- Importamos la fuente Fredoka redondeada -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
    
    <!-- LibrerÃ­as de TensorFlow.js y BlazeFace para el reconocimiento facial -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #d1f7ff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 35px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(209, 247, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 14px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            z-index: 20;
        }

        /* Contenedor de botones de control rÃ¡pido en esquina inferior derecha */
        .controls-corner {
            position: absolute;
            right: 14px;
            bottom: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .btn-accion {
            background-color: rgba(255, 105, 180, 0.2);
            color: #ff69b4;
            border: 1px solid #ff69b4;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            outline: none;
        }

        .btn-accion:active, .btn-accion.activo {
            background-color: #ff69b4;
            color: #000;
        }

        /* Rostro horizontal con amplio rango de recorrido */
        .face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            position: absolute;
            background-color: #000000;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 130px;
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .eye {
            width: 165px;
            height: 165px;
            background: #d1f7ff;
            border-radius: 50%;
            animation: blink 4.5s infinite ease-in-out;
            box-shadow: 
                0 0 35px rgba(209, 247, 255, 0.45),
                inset -18px -18px 0px rgba(18, 75, 160, 0.55);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.06); }
        }

        /* --- RELOJ iOS HORIZONTAL OPTIMIZADO --- */
        #clock-container {
            position: absolute;
            display: none;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            z-index: 50;
            background-color: #000000;
        }

        .ios-clock {
            font-family: 'Fredoka', sans-serif;
            font-size: min(53vh, 85vw); 
            font-weight: 700;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-items: center;
            width: 100%;
            height: 100%;
            line-height: 0.7;
            transform: translateX(-4vw); 
        }

        .digit-box {
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), color 2s ease-in-out;
            -webkit-text-stroke: 1.5px currentColor; 
            transform: scaleX(0.92);
        }

        .hours-container {
            display: flex;
            align-items: center;
            justify-self: end;
            margin-right: 3vh;
        }

        #h1 { z-index: 1; } 
        #h2 { margin-left: -5vh; z-index: 2; } 
        
        .separator {
            position: relative;
            width: 0px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            justify-self: center;
            z-index: 3;
        }

        .dot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: min(13vh, 13vw);  
            height: min(13vh, 13vw); 
            background-color: #8e8e93;
            border-radius: 50%;
            animation: pulseDot 2s infinite ease-in-out;
        }

        .dot:nth-child(1) { top: -24vw; }
        .dot:nth-child(2) { top: 13vw; }

        .minutes-container {
            display: flex;
            align-items: center;
            justify-self: start;
            margin-left: 3vh;
        }

        #m1 { z-index: 1; } 
        #m2 { margin-left: -5vh; z-index: 2; } 

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="iniciarSistema()">
        <h1>ðŸ¤– Robot Edy</h1>
        <p>Toca la pantalla para despertar a Edy</p>
        <button id="start-btn">INICIAR</button>
    </div>

    <div id="status">Desconectado</div>

    <!-- Botones de Acceso RÃ¡pido -->
    <div class="controls-corner">
        <button class="btn-accion" id="btn-seguimiento" onclick="event.stopPropagation(); toggleModoSeguimiento();">Seguimiento</button>
        <button class="btn-accion" onclick="event.stopPropagation(); forzarModoRelojManual();">Reloj</button>
    </div>

    <!-- Video oculto para procesar la cÃ¡mara frontal -->
    <video id="webcam" autoplay playsinline style="display:none;"></video>

    <!-- Rostro horizontal -->
    <div class="face-container" id="face" onclick="registrarInteraccion()">
        <div class="eyes-row" id="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
    </div>

    <!-- Pantalla de Reloj Horizontal -->
    <div id="clock-container" onclick="registrarInteraccion()">
        <div class="ios-clock">
            <div class="hours-container">
                <span class="digit-box" id="box-h1"><span id="h1">0</span></span>
                <span class="digit-box" id="box-h2"><span id="h2">0</span></span>
            </div>
            <div class="separator" id="box-sep">
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="minutes-container">
                <span class="digit-box" id="box-m1"><span id="m1">0</span></span>
                <span class="digit-box" id="box-m2"><span id="m2">0</span></span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const eyesRow = document.getElementById('eyes-row');
        const faceContainer = document.getElementById('face');
        const clockContainer = document.getElementById('clock-container');
        const btnSeguimiento = document.getElementById('btn-seguimiento');
        const videoElement = document.getElementById('webcam');
        
        const h1El = document.getElementById('h1');
        const h2El = document.getElementById('h2');
        const m1El = document.getElementById('m1');
        const m2El = document.getElementById('m2');

        const boxH1 = document.getElementById('box-h1');
        const boxH2 = document.getElementById('box-h2');
        const boxM1 = document.getElementById('box-m1');
        const boxM2 = document.getElementById('box-m2');

        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        let mqttClient = null;
        let mqttConectado = false;

        let timerInactividad30s = null;
        let timerReloj1min = null;
        let temporizadorEsquina = null;
        let modoCuriosoActivo = false;
        let modoRelojActivo = false;
        let modoSeguimientoActivo = false;
        let aiModel = null;
        let wakeLock = null;

        const ultimasRotaciones = { h1: null, h2: null, m1: null, m2: null };

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function conectarMqtt() {
            if (!window.mqtt) return;
            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, { clientId, clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => { 
                mqttConectado = true; 
                statusEl.textContent = 'Edy activo'; 
            });
        }

        async function enviarAccion(tipo) {
            if (mqttConectado && mqttClient) { 
                mqttClient.publish(MQTT_ACTION_TOPIC, tipo); 
                return; 
            }
            try { 
                await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' }); 
            } catch (e) {}
        }

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        }

        const posiciones = [
            { nombre: 'centro', x: 0,   y: 0 },
            { nombre: 'arriba_izq', x: -110, y: -65 },
            { nombre: 'arriba_der', x:  110, y: -65 },
            { nombre: 'abajo_izq',  x: -110, y:  65 },
            { nombre: 'abajo_der',  x:  110, y:  65 }
        ];

        function iniciarModoCurioso() {
            if (modoRelojActivo || modoSeguimientoActivo) return;
            modoCuriosoActivo = true;
            statusEl.textContent = 'Edy curioso...';
            bucleCurioso();
        }

        function bucleCurioso() {
            if (!modoCuriosoActivo || modoRelojActivo || modoSeguimientoActivo) return;
            let proximoIndex = Math.floor(Math.random() * 4) + 1;
            let destino = posiciones[proximoIndex];

            eyesRow.style.transform = `translate(${destino.x}px, ${destino.y}px)`;
            enviarAccion(destino.nombre);

            let tiempoEstancia = Math.floor(Math.random() * (5000 - 3000 + 1)) + 3000;
            temporizadorEsquina = setTimeout(bucleCurioso, tiempoEstancia);
        }

        function iniciarModoReloj() {
            if (modoSeguimientoActivo) return; // No interrumpir seguimiento
            modoCuriosoActivo = false;
            clearTimeout(temporizadorEsquina);
            modoRelojActivo = true;

            faceContainer.style.display = 'none';
            clockContainer.style.display = 'flex';
            statusEl.textContent = 'Modo Reloj';

            enviarAccion('centro_bloqueado');
            actualizarHoraReloj();
        }

        function forzarModoRelojManual() {
            if (modoSeguimientoActivo) toggleModoSeguimiento(); // Desactivar seguimiento si estÃ¡ activo
            clearTimeout(timerInactividad30s);
            clearTimeout(timerReloj1min);
            iniciarModoReloj();
        }

        /* --- CONTROL DEL MODO SEGUIMIENTO FACIAL --- */
        async function toggleModoSeguimiento() {
            modoSeguimientoActivo = !modoSeguimientoActivo;

            if (modoSeguimientoActivo) {
                btnSeguimiento.classList.add('activo');
                statusEl.textContent = 'Iniciando cÃ¡mara y IA...';
                
                // Asegurar que estamos en modo rostro normal y cancelar temporizadores de inactividad
                modoRelojActivo = false;
                modoCuriosoActivo = false;
                clearTimeout(temporizadorEsquina);
                clearTimeout(timerInactividad30s);
                clearTimeout(timerReloj1min);

                clockContainer.style.display = 'none';
                faceContainer.style.display = 'flex';
                eyesRow.style.transform = 'translate(0px, 0px)';

                if (!aiModel) {
                    try {
                        aiModel = await blazeface.load();
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: "user", width: 320, height: 240 }
                        });
                        videoElement.srcObject = stream;
                        await new Promise((resolve) => { videoElement.onloadedmetadata = () => { resolve(); }; });
                    } catch (err) {
                        statusEl.textContent = 'Error al acceder a la cÃ¡mara';
                        modoSeguimientoActivo = false;
                        btnSeguimiento.classList.remove('activo');
                        return;
                    }
                }
                statusEl.textContent = 'Modo Seguimiento Activo';
                bucleSeguimientoFacial();

            } else {
                btnSeguimiento.classList.remove('activo');
                statusEl.textContent = 'Seguimiento desactivado';
                enviarAccion('detener_robot');
                registrarInteraccion(); // Reiniciar temporizadores normales
            }
        }

        async function bucleSeguimientoFacial() {
            if (!modoSeguimientoActivo || !aiModel) return;

            try {
                const predictions = await aiModel.estimateFaces(videoElement, false);

                if (predictions.length > 0) {
                    const face = predictions[0];
                    const start = face.topLeft;
                    const end = face.bottomRight;
                    
                    const centerX = (start[0] + end[0]) / 2;
                    const videoWidth = videoElement.videoWidth || 320;
                    const errorX = centerX - (videoWidth / 2);

                    // Margen de tolerancia para centrado (evita vibraciones)
                    if (errorX > 45) {
                        enviarAccion('girar_derecha');
                    } else if (errorX < -45) {
                        enviarAccion('girar_izquierda');
                    } else {
                        enviarAccion('centrado_x');
                    }
                } else {
                    // Si pierde de vista el rostro, detener motores
                    enviarAccion('detener_robot');
                }
            } catch (e) {}

            // Escanear fotogramas continuamente cada 150ms
            if (modoSeguimientoActivo) {
                setTimeout(bucleSeguimientoFacial, 150);
            }
        }

        function aplicarRotacionInteligente(cajaContenedor, clavePosicion) {
            const posiblesAngulos = [6, -6, 0];
            let ultimaRot = ultimasRotaciones[clavePosicion];
            let angulosDisponibles = posiblesAngulos.filter(ang => ang !== ultimaRot);
            let nuevoAngulo = angulosDisponibles[Math.floor(Math.random() * angulosDisponibles.length)];

            ultimasRotaciones[clavePosicion] = nuevoAngulo;
            cajaContenedor.style.transform = `scaleX(0.92) rotate(${nuevoAngulo}deg)`;
        }

        function actualizarDigitoConRotacion(elementoTexto, cajaContenedor, clavePosicion, nuevoValor) {
            if (elementoTexto.textContent !== nuevoValor) {
                elementoTexto.textContent = nuevoValor;
                aplicarRotacionInteligente(cajaContenedor, clavePosicion);
            }
        }

        let cicloColor = 0;
        function actualizarColoresArmonicos() {
            if (!modoRelojActivo) return;
            cicloColor += 0.8;
            h1El.style.color = `hsl(${290 + Math.sin(cicloColor * 0.05) * 35}, 90%, 70%)`;
            h2El.style.color = `hsl(${315 + Math.cos(cicloColor * 0.06) * 30}, 95%, 68%)`;
            m1El.style.color = `hsl(${260 + Math.sin(cicloColor * 0.04 + 1) * 40}, 85%, 72%)`;
            m2El.style.color = `hsl(${335 + Math.cos(cicloColor * 0.05 + 2) * 35}, 90%, 65%)`;
        }

        function actualizarHoraReloj() {
            if (!modoRelojActivo) return;
            const now = new Date();
            let hours = (now.getHours() % 12 || 12).toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');

            actualizarDigitoConRotacion(h1El, boxH1, 'h1', hours[0]);
            actualizarDigitoConRotacion(h2El, boxH2, 'h2', hours[1]);
            actualizarDigitoConRotacion(m1El, boxM1, 'm1', minutes[0]);
            actualizarDigitoConRotacion(m2El, boxM2, 'm2', minutes[1]);

            actualizarColoresArmonicos();
            setTimeout(actualizarHoraReloj, 1000);
        }

        function registrarInteraccion() {
            if (modoSeguimientoActivo) return; // No interrumpir si el seguimiento estÃ¡ encendido
            activarPantallaCompleta();
            solicitarWakeLock();

            if (modoCuriosoActivo || modoRelojActivo) {
                modoCuriosoActivo = false;
                modoRelojActivo = false;
                clearTimeout(temporizadorEsquina);

                clockContainer.style.display = 'none';
                faceContainer.style.display = 'flex';
                eyesRow.style.transform = 'translate(0px, 0px)';
                
                enviarAccion('centro_bloqueado');
                statusEl.textContent = 'InteracciÃ³n detectada';
            }

            clearTimeout(timerInactividad30s);
            clearTimeout(timerReloj1min);

            timerInactividad30s = setTimeout(iniciarModoCurioso, 30000);
            timerReloj1min = setTimeout(iniciarModoReloj, 60000);
        }

        function iniciarSistema() {
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            solicitarWakeLock();
            conectarMqtt();

            eyesRow.style.transform = 'translate(0px, 0px)';
            enviarAccion('centro');

            timerInactividad30s = setTimeout(iniciarModoCurioso, 30000);
            timerReloj1min = setTimeout(iniciarModoReloj, 60000);
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                solicitarWakeLock();
            }
        });
    </script>
</body>
</html>
