<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - LOOI Normal Face</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #d1f7ff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 35px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(209, 247, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 14px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            z-index: 20;
        }

        /* Pantalla horizontal forzada a 90 grados */
        .face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            position: relative;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 110px; /* <--- Ojos mÃ¡s separados como pediste */
        }

        /* Ojos grandes, limpios y con brillo OLED */
        .eye {
            width: 165px;
            height: 165px;
            background: #d1f7ff;
            border-radius: 50%;
            animation: blink 4.5s infinite ease-in-out;
            box-shadow: 
                0 0 35px rgba(209, 247, 255, 0.45),
                inset -18px -18px 0px rgba(18, 75, 160, 0.55);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.06); }
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="iniciarSistema()">
        <h1>ðŸ¤– Robot Edy</h1>
        <p>Toca la pantalla para despertar a Edy</p>
        <button id="start-btn">INICIAR</button>
    </div>

    <div id="status">Desconectado</div>

    <div class="face-container" id="face">
        <div class="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        let mqttClient = null;
        let mqttConectado = false;

        function conectarMqtt() {
            if (!window.mqtt) return;
            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, { clientId, clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => { mqttConectado = true; statusEl.textContent = 'Edy conectado (Modo casual)'; });
        }

        async function enviarAccion(tipo) {
            if (mqttConectado && mqttClient) { mqttClient.publish(MQTT_ACTION_TOPIC, tipo); return; }
            try { await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' }); } catch (e) {}
        }

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        }

        // Bucle aleatorio casual para mover los servos y cambiar de posiciÃ³n de forma relajada
        function bucleCasual() {
            enviarAccion('casual');
            let tiempoAleatorio = Math.floor(Math.random() * (12000 - 5000 + 1)) + 5000;
            setTimeout(bucleCasual, tiempoAleatorio);
        }

        function iniciarSistema() {
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            conectarMqtt();
            bucleCasual();
        }
    </script>
</body>
</html>
