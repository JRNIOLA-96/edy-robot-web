<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - Test Dedicado de Motores</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #d1f7ff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 35px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(209, 247, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 14px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            z-index: 100;
        }

        /* Botones en la esquina inferior derecha */
        .controls-corner {
            position: absolute;
            right: 14px;
            bottom: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .btn-accion {
            background-color: rgba(255, 105, 180, 0.2);
            color: #ff69b4;
            border: 1px solid #ff69b4;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            outline: none;
        }

        .btn-accion:active, .btn-accion.activo {
            background-color: #ff69b4;
            color: #000;
        }

        /* Panel central de Test de Movimiento */
        #test-panel {
            position: absolute;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 80;
            gap: 25px;
        }

        .test-title {
            color: #00ffff;
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .motor-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 80%;
            max-width: 400px;
        }

        .motor-card span {
            color: #d1f7ff;
            font-weight: 700;
            font-size: 14px;
        }

        .motor-buttons-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-test {
            flex: 1;
            background-color: #00ffff;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .btn-test:active {
            background-color: #ff69b4;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        /* Rostro horizontal de Edy */
        .face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            position: absolute;
            background-color: #000000;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 130px;
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .eye {
            width: 165px;
            height: 165px;
            background: #d1f7ff;
            border-radius: 50%;
            animation: blink 4.5s infinite ease-in-out;
            box-shadow: 
                0 0 35px rgba(209, 247, 255, 0.45),
                inset -18px -18px 0px rgba(18, 75, 160, 0.55);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.06); }
        }

        /* Reloj iOS */
        #clock-container {
            position: absolute;
            display: none;
            justify-content: center;
            align-items: center;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            z-index: 50;
            background-color: #000000;
        }

        .ios-clock {
            font-family: 'Fredoka', sans-serif;
            font-size: min(53vh, 85vw); 
            font-weight: 700;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-items: center;
            width: 100%;
            height: 100%;
            line-height: 0.7;
            transform: translateX(-4vw); 
        }

        .digit-box {
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), color 2s ease-in-out;
            -webkit-text-stroke: 1.5px currentColor; 
            transform: scaleX(0.92);
        }

        .hours-container { display: flex; align-items: center; justify-self: end; margin-right: 3vh; }
        #h1 { z-index: 1; } 
        #h2 { margin-left: -5vh; z-index: 2; } 
        
        .separator {
            position: relative;
            width: 0px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            justify-self: center;
            z-index: 3;
        }

        .dot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: min(13vh, 13vw);  
            height: min(13vh, 13vw); 
            background-color: #8e8e93;
            border-radius: 50%;
            animation: pulseDot 2s infinite ease-in-out;
        }
        .dot:nth-child(1) { top: -24vw; }
        .dot:nth-child(2) { top: 13vw; }

        .minutes-container { display: flex; align-items: center; justify-self: start; margin-left: 3vh; }
        #m1 { z-index: 1; } 
        #m2 { margin-left: -5vh; z-index: 2; } 

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="iniciarSistema()">
        <h1>ðŸ¤– Robot Edy</h1>
        <p>Toca la pantalla para despertar a Edy</p>
        <button id="start-btn">INICIAR</button>
    </div>

    <div id="status">Desconectado</div>

    <!-- Botones de Acceso en Esquina -->
    <div class="controls-corner">
        <button class="btn-accion" id="btn-test" onclick="event.stopPropagation(); toggleTestMovimiento();">Test Movimiento</button>
        <button class="btn-accion" onclick="event.stopPropagation(); forzarModoRelojManual();">Reloj</button>
    </div>

    <!-- Panel Dedicado de Test de Motores -->
    <div id="test-panel" onclick="event.stopPropagation()">
        <div class="test-title">âš™ï¸ Test de Servomotores</div>
        
        <!-- Servo Izquierdo (Pin 13) -->
        <div class="motor-card">
            <span>Servo Izquierdo (Pin 13)</span>
            <div class="motor-buttons-row">
                <button class="btn-test" 
                    ontouchstart="enviarAccion('test_izq_horario'); event.preventDefault();" 
                    onmousedown="enviarAccion('test_izq_horario')" 
                    ontouchend="enviarAccion('detener_robot')" 
                    onmouseup="enviarAccion('detener_robot')">Girar Sentido A</button>
                <button class="btn-test" 
                    ontouchstart="enviarAccion('test_izq_antihorario'); event.preventDefault();" 
                    onmousedown="enviarAccion('test_izq_antihorario')" 
                    ontouchend="enviarAccion('detener_robot')" 
                    onmouseup="enviarAccion('detener_robot')">Girar Sentido B</button>
            </div>
        </div>

        <!-- Servo Derecho (Pin 12) -->
        <div class="motor-card">
            <span>Servo Derecho (Pin 12)</span>
            <div class="motor-buttons-row">
                <button class="btn-test" 
                    ontouchstart="enviarAccion('test_der_horario'); event.preventDefault();" 
                    onmousedown="enviarAccion('test_der_horario')" 
                    ontouchend="enviarAccion('detener_robot')" 
                    onmouseup="enviarAccion('detener_robot')">Girar Sentido A</button>
                <button class="btn-test" 
                    ontouchstart="enviarAccion('test_der_antihorario'); event.preventDefault();" 
                    onmousedown="enviarAccion('test_der_antihorario')" 
                    ontouchend="enviarAccion('detener_robot')" 
                    onmouseup="enviarAccion('detener_robot')">Girar Sentido B</button>
            </div>
        </div>
    </div>

    <!-- Rostro horizontal -->
    <div class="face-container" id="face" onclick="registrarInteraccion()">
        <div class="eyes-row" id="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
    </div>

    <!-- Reloj -->
    <div id="clock-container" onclick="registrarInteraccion()">
        <div class="ios-clock">
            <div class="hours-container">
                <span class="digit-box" id="box-h1"><span id="h1">0</span></span>
                <span class="digit-box" id="box-h2"><span id="h2">0</span></span>
            </div>
            <div class="separator" id="box-sep">
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="minutes-container">
                <span class="digit-box" id="box-m1"><span id="m1">0</span></span>
                <span class="digit-box" id="box-m2"><span id="m2">0</span></span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const eyesRow = document.getElementById('eyes-row');
        const faceContainer = document.getElementById('face');
        const clockContainer = document.getElementById('clock-container');
        const testPanel = document.getElementById('test-panel');
        const btnTest = document.getElementById('btn-test');
        
        const h1El = document.getElementById('h1');
        const h2El = document.getElementById('h2');
        const m1El = document.getElementById('m1');
        const m2El = document.getElementById('m2');

        const boxH1 = document.getElementById('box-h1');
        const boxH2 = document.getElementById('box-h2');
        const boxM1 = document.getElementById('box-m1');
        const boxM2 = document.getElementById('box-m2');

        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        let mqttClient = null;
        let mqttConectado = false;

        let timerInactividad30s = null;
        let timerReloj1min = null;
        let temporizadorEsquina = null;
        let modoCuriosoActivo = false;
        let modoRelojActivo = false;
        let modoTestActivo = false;
        let wakeLock = null;

        const ultimasRotaciones = { h1: null, h2: null, m1: null, m2: null };

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function conectarMqtt() {
            if (!window.mqtt) return;
            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, { clientId, clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => { 
                mqttConectado = true; 
                statusEl.textContent = 'Edy activo'; 
            });
        }

        async function enviarAccion(tipo) {
            if (mqttConectado && mqttClient) { 
                mqttClient.publish(MQTT_ACTION_TOPIC, tipo); 
                return; 
            }
            try { 
                await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' }); 
            } catch (e) {}
        }

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        }

        const posiciones = [
            { nombre: 'centro', x: 0,   y: 0 },
            { nombre: 'arriba_izq', x: -110, y: -65 },
            { nombre: 'arriba_der', x:  110, y: -65 },
            { nombre: 'abajo_izq',  x: -110, y:  65 },
            { nombre: 'abajo_der',  x:  110, y:  65 }
        ];

        function iniciarModoCurioso() {
            if (modoRelojActivo || modoTestActivo) return;
            modoCuriosoActivo = true;
            statusEl.textContent = 'Edy curioso...';
            bucleCurioso();
        }

        function bucleCurioso() {
            if (!modoCuriosoActivo || modoRelojActivo || modoTestActivo) return;
            let proximoIndex = Math.floor(Math.random() * 4) + 1;
            let destino = posiciones[proximoIndex];

            eyesRow.style.transform = `translate(${destino.x}px, ${destino.y}px)`;
            enviarAccion(destino.nombre);

            let tiempoEstancia = Math.floor(Math.random() * (5000 - 3000 + 1)) + 3000;
            temporizadorEsquina = setTimeout(bucleCurioso, tiempoEstancia);
        }

        function iniciarModoReloj() {
            if (modoTestActivo) return;
            modoCuriosoActivo = false;
            clearTimeout(temporizadorEsquina);
            modoRelojActivo = true;

            faceContainer.style.display = 'none';
            testPanel.style.display = 'none';
            clockContainer.style.display = 'flex';
            statusEl.textContent = 'Modo Reloj';

            enviarAccion('centro_bloqueado');
            actualizarHoraReloj();
        }

        function forzarModoRelojManual() {
            if (modoTestActivo) toggleTestMovimiento();
            clearTimeout(timerInactividad30s);
            clearTimeout(timerReloj1min);
            iniciarModoReloj();
        }

        function toggleTestMovimiento() {
            modoTestActivo = !modoTestActivo;

            if (modoTestActivo) {
                btnTest.classList.add('activo');
                statusEl.textContent = 'Modo Test Activo';

                modoRelojActivo = false;
                modoCuriosoActivo = false;
                clearTimeout(temporizadorEsquina);
                clearTimeout(timerInactividad30s);
                clearTimeout(timerReloj1min);

                clockContainer.style.display = 'none';
                faceContainer.style.display = 'none';
                testPanel.style.display = 'flex';
            } else {
                btnTest.classList.remove('activo');
                statusEl.textContent = 'Test finalizado';
                testPanel.style.display = 'none';
                faceContainer.style.display = 'flex';
                enviarAccion('detener_robot');
                registrarInteraccion();
            }
        }

        function aplicarRotacionInteligente(cajaContenedor, clavePosicion) {
            const posiblesAngulos = [6, -6, 0];
            let ultimaRot = ultimasRotaciones[clavePosicion];
            let angulosDisponibles = posiblesAngulos.filter(ang => ang !== ultimaRot);
            let nuevoAngulo = angulosDisponibles[Math.floor(Math.random() * angulosDisponibles.length)];

            ultimasRotaciones[clavePosicion] = nuevoAngulo;
            cajaContenedor.style.transform = `scaleX(0.92) rotate(${nuevoAngulo}deg)`;
        }

        function actualizarDigitoConRotacion(elementoTexto, cajaContenedor, clavePosicion, nuevoValor) {
            if (elementoTexto.textContent !== nuevoValor) {
                elementoTexto.textContent = nuevoValor;
                aplicarRotacionInteligente(cajaContenedor, clavePosicion);
            }
        }

        let cicloColor = 0;
        function actualizarColoresArmonicos() {
            if (!modoRelojActivo) return;
            cicloColor += 0.8;
            h1El.style.color = `hsl(${290 + Math.sin(cicloColor * 0.05) * 35}, 90%, 70%)`;
            h2El.style.color = `hsl(${315 + Math.cos(cicloColor * 0.06) * 30}, 95%, 68%)`;
            m1El.style.color = `hsl(${260 + Math.sin(cicloColor * 0.04 + 1) * 40}, 85%, 72%)`;
            m2El.style.color = `hsl(${335 + Math.cos(cicloColor * 0.05 + 2) * 35}, 90%, 65%)`;
        }

        function actualizarHoraReloj() {
            if (!modoRelojActivo) return;
            const now = new Date();
            let hours = (now.getHours() % 12 || 12).toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');

            actualizarDigitoConRotacion(h1El, boxH1, 'h1', hours[0]);
            actualizarDigitoConRotacion(h2El, boxH2, 'h2', hours[1]);
            actualizarDigitoConRotacion(m1El, boxM1, 'm1', minutes[0]);
            actualizarDigitoConRotacion(m2El, boxM2, 'm2', minutes[1]);

            actualizarColoresArmonicos();
            setTimeout(actualizarHoraReloj, 1000);
        }

        function registrarInteraccion() {
            if (modoTestActivo) return; 
            activarPantallaCompleta();
            solicitarWakeLock();

            if (modoCuriosoActivo || modoRelojActivo) {
                modoCuriosoActivo = false;
                modoRelojActivo = false;
                clearTimeout(temporizadorEsquina);

                clockContainer.style.display = 'none';
                testPanel.style.display = 'none';
                faceContainer.style.display = 'flex';
                eyesRow.style.transform = 'translate(0px, 0px)';
                
                enviarAccion('centro_bloqueado');
                statusEl.textContent = 'InteracciÃ³n detectada';
            }

            clearTimeout(timerInactividad30s);
            clearTimeout(timerReloj1min);

            timerInactividad30s = setTimeout(iniciarModoCurioso, 30000);
            timerReloj1min = setTimeout(iniciarModoReloj, 60000);
        }

        function iniciarSistema() {
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            solicitarWakeLock();
            conectarMqtt();

            eyesRow.style.transform = 'translate(0px, 0px)';
            enviarAccion('centro');

            timerInactividad30s = setTimeout(iniciarModoCurioso, 30000);
            timerReloj1min = setTimeout(iniciarModoReloj, 60000);
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                solicitarWakeLock();
            }
        });
    </script>
</body>
</html>
