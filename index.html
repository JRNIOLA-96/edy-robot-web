<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - LOOI Control de Servos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #d1f7ff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 35px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(209, 247, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 14px;
            bottom: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            z-index: 20;
        }

        /* Pantalla horizontal forzada a 90 grados */
        .face-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            position: relative;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 110px;
        }

        /* Ojos grandes, limpios y con brillo OLED */
        .eye {
            width: 165px;
            height: 165px;
            background: #d1f7ff;
            border-radius: 50%;
            animation: blink 4.5s infinite ease-in-out;
            box-shadow: 
                0 0 35px rgba(209, 247, 255, 0.45),
                inset -18px -18px 0px rgba(18, 75, 160, 0.55);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.06); }
        }

        /* Contenedor de botones de prueba de servos */
        .servo-controls {
            display: flex;
            gap: 15px;
            z-index: 30;
        }

        .servo-btn {
            background-color: rgba(0, 243, 255, 0.15);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .servo-btn:active {
            background-color: #00f3ff;
            color: #000;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="start-screen" onclick="iniciarSistema()">
        <h1>ðŸ¤– Robot Edy</h1>
        <p>Toca la pantalla para despertar a Edy</p>
        <button id="start-btn">INICIAR</button>
    </div>

    <div id="status">Desconectado</div>

    <div class="face-container" id="face">
        <div class="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>

        <!-- Botones en pantalla para probar los 3 servos (+60Â° y regreso) -->
        <div class="servo-controls">
            <button class="servo-btn" onclick="enviarAccion('servo_izq')">Brazo Izq (13)</button>
            <button class="servo-btn" onclick="enviarAccion('servo_cabeza')">Cabeza (14)</button>
            <button class="servo-btn" onclick="enviarAccion('servo_der')">Brazo Der (12)</button>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        let mqttClient = null;
        let mqttConectado = false;

        function conectarMqtt() {
            if (!window.mqtt) return;
            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, { clientId, clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => { mqttConectado = true; statusEl.textContent = 'Edy conectado (Modo botones)'; });
        }

        async function enviarAccion(tipo) {
            statusEl.textContent = 'Enviando: ' + tipo;
            if (mqttConectado && mqttClient) { 
                mqttClient.publish(MQTT_ACTION_TOPIC, tipo); 
                return; 
            }
            try { 
                let res = await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' }); 
                if(res.ok) statusEl.textContent = 'AcciÃ³n ejecutada: ' + tipo;
            } catch (e) {
                statusEl.textContent = 'Error al enviar acciÃ³n';
            }
        }

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        }

        function iniciarSistema() {
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            conectarMqtt();
        }
    </script>
</body>
</html>
