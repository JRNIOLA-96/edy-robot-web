<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edy - Robot Companion</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Botón inicial para activar permisos de micrófono y audio obligatorios */
        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        #start-btn {
            background-color: #00ffff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        #status {
            position: absolute;
            left: 12px;
            bottom: 10px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            letter-spacing: 0;
            z-index: 20;
        }

        .face-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            cursor: pointer;
            position: relative;
        }

        .eyes-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 82px;
            position: relative;
        }

        .eye {
            width: 112px;
            height: 86px;
            background: #5de7ff;
            border-radius: 48% 48% 42% 42%;
            animation: blink 4s infinite;
            transition: all 0.3s ease;
            box-shadow:
                0 0 18px rgba(0, 210, 255, 0.55),
                inset 0 -10px 0 rgba(20, 98, 210, 0.55);
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }

        .mouth {
            width: 32px;
            height: 14px;
            border-bottom: 4px solid #78efff;
            border-radius: 0 0 16px 16px;
            background: transparent;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.55));
        }

        .command-output {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            text-align: center;
            text-shadow: 0 0 18px rgba(0, 255, 255, 0.75);
            pointer-events: none;
        }

        .output-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .output-value {
            font-size: 76px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .output-subtitle {
            margin-top: 12px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }

        .face-container.show-output .eyes-row,
        .face-container.show-output .mouth,
        .face-container.show-output .floating-elements {
            display: none;
        }

        .face-container.show-output .command-output {
            display: flex;
        }

        @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.08); }
        }

        /* --- EXPRESIONES --- */
        .expr-normal .eye { width: 112px; height: 86px; border-radius: 48% 48% 42% 42%; background: #5de7ff; }
        .expr-normal .mouth { width: 32px; height: 14px; border-bottom: 4px solid #78efff; border-radius: 0 0 16px 16px; }

        .expr-enojado .eye {
            width: 116px;
            height: 82px;
            border-radius: 58% 58% 38% 38%;
            background: #ff477a;
            transform: rotate(-10deg) skewX(-8deg);
            animation: rageShake 0.15s infinite alternate;
            box-shadow: 0 0 18px rgba(255, 55, 100, 0.65), inset 0 -10px 0 rgba(90, 0, 38, 0.42);
        }
        .expr-enojado .eye + .eye { transform: rotate(10deg) skewX(8deg); }
        .expr-enojado .mouth { width: 28px; height: 12px; border-top: 4px solid #ff477a; border-bottom: none; border-radius: 16px 16px 0 0; }
        .expr-enojado .fe-enojado { display: none; }
        @keyframes rageShake { 0% { transform: rotate(-10deg) translateY(0) skewX(-8deg); } 100% { transform: rotate(-10deg) translateY(-3px) skewX(-8deg); } }
        .fe-enojado span { position: absolute; font-size: 28px; animation: steamFloat 1s infinite linear; opacity: 0; }
        .fe-enojado span:nth-child(1) { left: 15%; top: 40%; }
        .fe-enojado span:nth-child(2) { right: 15%; top: 40%; animation-delay: 0.5s; }
        @keyframes steamFloat { 0% { transform: translateY(10px) scale(0.8); opacity: 1; } 100% { transform: translateY(-25px) scale(1.2); opacity: 0; } }

        .expr-confundido .eye {
            width: 96px;
            height: 82px;
            border-radius: 24px;
            clip-path: polygon(18% 8%, 82% 10%, 96% 52%, 68% 94%, 16% 82%, 4% 34%);
            background: #63e8ff;
            transform: rotate(-13deg);
        }
        .expr-confundido .eye + .eye { clip-path: polygon(12% 20%, 70% 4%, 98% 38%, 82% 86%, 22% 96%, 2% 56%); transform: rotate(12deg); }
        .expr-confundido .mouth { width: 26px; height: 10px; border-bottom: 4px solid #78efff; border-radius: 50%; transform: rotate(10deg); }

        .expr-sueo .eye { width: 116px; height: 58px; border-radius: 64px 64px 12px 12px; background: #5aaeff; opacity: 0.95; }
        .expr-sueo .mouth { width: 18px; height: 14px; border-radius: 50%; background-color: #5aaeff; border: none; }
        .expr-sueo .fe-sueo { display: block; }
        .fe-sueo span { position: absolute; right: 25%; top: 35%; font-weight: bold; color: #74dfff; font-size: 24px; animation: zzzFloat 2s infinite ease-in-out; opacity: 0; }
        .fe-sueo span:nth-child(1) { animation-delay: 0s; right: 28%; }
        .fe-sueo span:nth-child(2) { animation-delay: 0.7s; right: 24%; }
        .fe-sueo span:nth-child(3) { animation-delay: 1.4s; right: 20%; }
        @keyframes zzzFloat { 0% { transform: translate(0, 0) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(30px, -40px) scale(1.3); opacity: 0; } }

        .expr-cosquillas .eye { width: 112px; height: 56px; border-radius: 64px 64px 12px 12px; background: #5de7ff; animation: happyBounce 0.55s infinite alternate; }
        .expr-cosquillas .mouth { width: 46px; height: 22px; border-bottom: 5px solid #78efff; border-radius: 0 0 28px 28px; }
        @keyframes happyBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

        .expr-beso .eye { width: 104px; height: 104px; background-color: #ff5aa5; border-radius: 50% 50% 0 50%; transform: rotate(-45deg) scale(1.05); animation: heartbeat 0.8s infinite alternate; box-shadow: 0 0 18px rgba(255, 80, 160, 0.55); }
        .expr-beso .eye + .eye { border-radius: 50% 50% 50% 0; transform: rotate(45deg) scale(1.05); animation: heartbeat 0.8s infinite alternate; }
        .expr-beso .mouth { width: 24px; height: 24px; background: transparent; border-right: 4px solid #ff5aa5; border-top: 4px solid #ff5aa5; border-bottom: 4px solid #ff5aa5; border-radius: 0 50% 50% 0; transform: rotate(-90deg) scale(1.25); }
        .expr-beso .fe-beso { display: block; }
        .fe-beso span { position: absolute; font-size: 26px; animation: heartFloat 1.5s infinite ease-in; opacity: 0; }
        .fe-beso span:nth-child(1) { left: 20%; top: 50%; }
        .fe-beso span:nth-child(2) { right: 20%; top: 50%; animation-delay: 0.7s; }
        @keyframes heartFloat { 0% { transform: translateY(0) scale(0.6); opacity: 1; } 100% { transform: translateY(-50px) scale(1.3); opacity: 0; } }
        @keyframes heartbeat { 0% { transform: scale(1) rotate(var(--r, -45deg)); } 100% { transform: scale(1.15) rotate(var(--r, -45deg)); } }

        .expr-escucha .eyes-row { gap: 90px; }
        .expr-escucha .eye {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background-color: #00ffff;
            animation: listenCalm 1s infinite alternate;
            box-shadow: 0 0 22px rgba(0, 255, 255, 0.55), inset -8px -8px 0 rgba(0, 0, 0, 0.25);
        }
        .expr-escucha .mouth {
            width: 35px;
            height: 15px;
            background: transparent;
            border-bottom: 5px solid #00ffff;
            border-radius: 0 0 15px 15px;
            animation: none;
        }
        .expr-escucha .fe-escucha { display: none; }
        .fe-escucha span {
            position: absolute;
            width: 76px;
            height: 76px;
            border: 5px solid rgba(0, 255, 255, 0.75);
            border-top-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            color: transparent;
            animation: listenWave 1.1s infinite ease-out;
            opacity: 0;
        }
        .fe-escucha span:nth-child(1) { left: 8%; top: 43%; }
        .fe-escucha span:nth-child(2) { right: 8%; top: 43%; animation-delay: 0.45s; }
        @keyframes listenCalm { 0% { transform: scale(1); } 100% { transform: scale(1.04); } }
        @keyframes listenWave { 0% { transform: scale(0.45); opacity: 0.95; } 100% { transform: scale(1.55); opacity: 0; } }
    </style>
</head>
<body>

    <!-- Pantalla de inicio obligatoria para desbloquear audio y micrófono -->
    <div id="start-screen" onclick="iniciarSistema()">
        <h1>🤖 Robot Edy</h1>
        <p>Toca el botón para conectar la cara con el ESP32</p>
        <button id="start-btn">CONECTAR</button>
    </div>

    <div id="status">Conectando con Edy...</div>

    <div class="face-container expr-normal" id="face" onclick="tocarCara()">
        <div class="floating-elements fe-enojado"><span>💨</span><span>💨</span></div>
        <div class="floating-elements fe-sueo"><span>Z</span><span>z</span><span>Z</span></div>
        <div class="floating-elements fe-beso"><span>❤️</span><span>💖</span></div>
        <div class="floating-elements fe-escucha"><span>🎙️</span><span>🎙️</span></div>

        <div class="eyes-row">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth" id="mouth"></div>
        <div class="command-output" id="command-output">
            <div class="output-title" id="output-title"></div>
            <div class="output-value" id="output-value"></div>
            <div class="output-subtitle" id="output-subtitle"></div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const statusEl = document.getElementById('status');
        const face = document.getElementById('face');
        const outputTitle = document.getElementById('output-title');
        const outputValue = document.getElementById('output-value');
        const outputSubtitle = document.getElementById('output-subtitle');
        const PALABRAS_ACTIVACION = ['edy', 'edi', 'edie', 'eddy', 'heddy', 'hey edy'];
        const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
        const MQTT_ACTION_TOPIC = 'edy/jordan/robot01/accion';
        const MQTT_STATUS_TOPIC = 'edy/jordan/robot01/estado';
        let mqttClient = null;
        let mqttConectado = false;

        function conectarMqtt() {
            if (!window.mqtt) {
                statusEl.textContent = 'No se cargo MQTT. Revisa internet.';
                return;
            }

            const clientId = 'edy-web-' + Math.random().toString(16).slice(2);
            mqttClient = mqtt.connect(MQTT_URL, {
                clientId,
                clean: true,
                reconnectPeriod: 3000,
                connectTimeout: 8000
            });

            mqttClient.on('connect', () => {
                mqttConectado = true;
                mqttClient.subscribe(MQTT_STATUS_TOPIC);
                statusEl.textContent = 'MQTT conectado. Edy listo.';
            });

            mqttClient.on('reconnect', () => {
                statusEl.textContent = 'Reconectando con Edy...';
            });

            mqttClient.on('message', (topic, payload) => {
                if (topic === MQTT_STATUS_TOPIC) {
                    statusEl.textContent = 'ESP32: ' + payload.toString();
                }
            });

            mqttClient.on('error', (error) => {
                mqttConectado = false;
                statusEl.textContent = 'Error MQTT';
                console.log('MQTT error:', error);
            });

            mqttClient.on('close', () => {
                mqttConectado = false;
            });
        }

        async function enviarAccion(tipo) {
            if (mqttConectado && mqttClient) {
                mqttClient.publish(MQTT_ACTION_TOPIC, tipo);
                statusEl.textContent = 'Enviado a Edy: ' + tipo;
                return;
            }

            try {
                const response = await fetch('/accion?tipo=' + encodeURIComponent(tipo), { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                statusEl.textContent = 'ESP32 sincronizado: ' + tipo;
            } catch (error) {
                statusEl.textContent = 'Sin MQTT ni respuesta local del ESP32';
                console.log('Error enviando accion:', error);
            }
        }

        async function consultarEstado() {
            try {
                const response = await fetch('/estado', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const estado = await response.json();
                statusEl.textContent = 'Edy en ' + estado.modo + ' | IP ' + estado.ip;
            } catch (error) {
                statusEl.textContent = 'Abre esta pagina desde la IP del ESP32';
            }
        }

        function playSound(tipo) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (tipo === 'mov_enojado') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now); osc.frequency.setValueAtTime(80, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.4);
            } else if (tipo === 'mov_confundido') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.15);
                gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
            } else if (tipo === 'mov_sueo') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(70, now + 0.8);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.8);
            } else if (tipo === 'mov_cosquillas') {
                osc.type = 'square';
                for(let i=0; i<4; i++) { osc.frequency.setValueAtTime(500 + (i*150), now + (i * 0.08)); }
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.35);
            } else if (tipo === 'mov_beso') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(700, now); osc.frequency.setValueAtTime(1100, now + 0.1);
                gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
                return;
            } else if (tipo === 'mov_escucha') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(660, now + 0.08);
                osc.frequency.setValueAtTime(880, now + 0.18);
                osc.frequency.setValueAtTime(660, now + 0.32);
                gainNode.gain.setValueAtTime(0.16, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
                return;
            } else {
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
            }
            osc.start(now); osc.stop(now + 0.3);
        }

        const listaExpr = [
            { nombre: 'normal', mov: 'mov_normal' },
            { nombre: 'enojado', mov: 'mov_enojado' },
            { nombre: 'confundido', mov: 'mov_confundido' },
            { nombre: 'sueo', mov: 'mov_sueo' },
            { nombre: 'cosquillas', mov: 'mov_cosquillas' },
            { nombre: 'beso', mov: 'mov_beso' }
        ];

        let temporizadorRandom = null;
        let escuchandoVoz = false;
        let esperandoComando = false;
        let temporizadorComando = null;
        let modoActivo = 'idle';
        let ultimoWakeAt = 0;
        let recognition = null;

        function activarPantallaCompleta() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(err => {}); }
        }

        function cambiarAleatorio() {
            if (modoActivo !== 'idle') return;
            activarPantallaCompleta();
            let randomIndex = Math.floor(Math.random() * listaExpr.length);
            let actual = listaExpr[randomIndex];

            face.classList.remove('show-output');
            face.className = "face-container expr-" + actual.nombre;
            playSound(actual.mov);
            enviarAccion(actual.mov);

            let tiempoAleatorio = Math.floor(Math.random() * (15000 - 3000 + 1)) + 3000;
            clearTimeout(temporizadorRandom);
            temporizadorRandom = setTimeout(cambiarAleatorio, tiempoAleatorio);
        }

        function tocarCara() {
            if (modoActivo !== 'idle') return;
            clearTimeout(temporizadorRandom);
            cambiarAleatorio();
        }

        function iniciarReconocimientoVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const speechResult = event.results[i][0].transcript;
                    const tieneWake = contieneActivacion(speechResult);

                    if (modoActivo === 'idle' && !tieneWake) {
                        continue;
                    }

                    if (modoActivo !== 'idle') {
                        statusEl.textContent = 'Escuche: ' + speechResult;
                    }

                    if (!event.results[i].isFinal && modoActivo === 'idle' && tieneWake) {
                        activarModoEscucha();
                    }
                    if (event.results[i].isFinal) {
                        console.log("Escuchado: " + speechResult);
                        procesarVoz(speechResult);
                    }
                }
            };

            recognition.onerror = function(event) {
                console.log('Reconocimiento error:', event.error);
                setTimeout(() => { recognition.start(); }, 1000);
            };

            recognition.onend = function() {
                try { recognition.start(); } catch(e) {}
            };

            recognition.start();
        }

        async function pedirPermisoMicrofono() {
            if (!window.isSecureContext) {
                statusEl.textContent = 'El microfono requiere HTTPS. Usa Netlify o GitHub Pages.';
                return false;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.textContent = 'Este navegador no expone el microfono.';
                return false;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                statusEl.textContent = 'Microfono permitido.';
                return true;
            } catch (error) {
                statusEl.textContent = 'Permiso de microfono rechazado o bloqueado.';
                console.log('Microfono error:', error);
                return false;
            }
        }

        function normalizarTexto(texto) {
            return texto
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[.,;:!?¿¡]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function contieneActivacion(texto) {
            const limpio = normalizarTexto(texto);
            return PALABRAS_ACTIVACION.some(palabra => limpio.includes(palabra));
        }

        function quitarActivacion(texto) {
            let limpio = normalizarTexto(texto);
            PALABRAS_ACTIVACION.forEach(palabra => {
                limpio = limpio.split(palabra).join('');
            });
            return limpio.replace(/\s+/g, ' ').trim();
        }

        function procesarVoz(texto) {
            const textoNormalizado = normalizarTexto(texto);

            if (esperandoComando) {
                const comandoLimpio = quitarActivacion(texto);
                if (!comandoLimpio) {
                    statusEl.textContent = 'Te escucho... ahora dime el comando';
                    return;
                }
                ejecutarComandoVoz(comandoLimpio);
                return;
            }

            if (modoActivo === 'idle' && contieneActivacion(textoNormalizado)) {
                const comandoEnMismaFrase = quitarActivacion(texto);
                activarModoEscucha();

                if (comandoEnMismaFrase.length > 2) {
                    setTimeout(() => ejecutarComandoVoz(comandoEnMismaFrase), 450);
                }
            }
        }

        function activarModoEscucha() {
            activarPantallaCompleta();
            clearTimeout(temporizadorRandom);
            clearTimeout(temporizadorComando);
            ultimoWakeAt = Date.now();
            escuchandoVoz = true;
            esperandoComando = true;
            modoActivo = 'escucha';

            face.className = "face-container expr-escucha";
            playSound('mov_escucha');
            enviarAccion('mov_escucha');
            outputTitle.textContent = '';
            outputValue.textContent = '';
            outputSubtitle.textContent = '';
            statusEl.textContent = 'Te escucho... di un comando';

            temporizadorComando = setTimeout(() => {
                escuchandoVoz = false;
                esperandoComando = false;
                modoActivo = 'idle';
                cambiarAleatorio();
            }, 6000);
        }

        function ejecutarComandoVoz(comando) {
            const texto = normalizarTexto(comando);
            console.log("Comando: " + texto);
            clearTimeout(temporizadorComando);
            esperandoComando = false;
            modoActivo = 'respuesta';

            if (texto.includes('hora')) {
                mostrarHora();
                return;
            }

            mostrarMensajeTemporal('No entendi', 'Di: que hora es', 2200);
        }

        function mostrarHora() {
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString('es-EC', {
                hour: '2-digit',
                minute: '2-digit'
            });
            const fecha = ahora.toLocaleDateString('es-EC', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });

            mostrarMensajeTemporal('La hora es', hora, 5000, fecha);
        }

        function mostrarMensajeTemporal(titulo, valor, duracion, subtitulo = '') {
            clearTimeout(temporizadorRandom);
            clearTimeout(temporizadorComando);
            escuchandoVoz = true;
            esperandoComando = false;
            modoActivo = 'respuesta';

            face.className = "face-container expr-normal show-output";
            outputTitle.textContent = titulo;
            outputValue.textContent = valor;
            outputSubtitle.textContent = subtitulo;
            statusEl.textContent = titulo + ': ' + valor;

            setTimeout(() => {
                face.classList.remove('show-output');
                escuchandoVoz = false;
                modoActivo = 'idle';
                cambiarAleatorio();
            }, duracion);
        }

        // Función que se ejecuta al presionar el botón de inicio (Desbloquea permisos)
        async function iniciarSistema() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.getElementById('start-screen').style.display = 'none';
            activarPantallaCompleta();
            conectarMqtt();
            const microfonoOk = await pedirPermisoMicrofono();
            
            // Iniciar flujos
            modoActivo = 'idle';
            cambiarAleatorio();
            if (microfonoOk) {
                iniciarReconocimientoVoz();
            }
        }
    </script>
</body>
</html>
